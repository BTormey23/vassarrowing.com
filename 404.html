(function(){
  var p = location.pathname.toLowerCase().replace(/\/+$/, '');
  var m = p.match(/^\/give2brew(\d{4})(\/|$)/), to = null;
  if (m) to = '/Give2Brew' + m[1] + '/';
  else if (p === '/give2brew' || p.indexOf('/give2brew/') === 0) to = '/Give2Brew/';

  // only redirect when it changes the address (a year with no page yet just shows this page)
  if (to && to !== location.pathname) location.replace(to + location.search + location.hash);
})();
</script>
